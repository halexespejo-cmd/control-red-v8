version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: control-red-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=sqlite+aiosqlite:///./data/control_red.db
      - NETWORK_INTERFACE=eth0
      - SCAN_INTERVAL=15
      - ARP_INTERVAL=2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/src:/app/src
      - backend-data:/app/data
    networks:
      - control-red-network
    restart: unless-stopped
    # Requires --cap-add=NET_ADMIN for ARP spoofing
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: control-red-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - control-red-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL (optional - for production)
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: control-red-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=control_red
  #     - POSTGRES_PASSWORD=your_secure_password
  #     - POSTGRES_DB=control_red
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - control-red-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U control_red"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  backend-data:
    driver: local
  redis-data:
    driver: local
  # postgres-data:
  #   driver: local

networks:
  control-red-network:
    driver: bridge
